packages: []

savePrefix: ''
# updates are handled by Renovate itself
updateNotifier: false
# https://pnpm.io/cli/run
shellEmulator: true

allowBuilds:
  core-js-pure: false
  esbuild: false
  protobufjs: false
  unrs-resolver: false
  re2: true

dedupePeers: true

overrides:
  '@aws-sdk/xml-builder@3.972.4>fast-xml-parser': '^5.3.6'
  '@yarnpkg/core@4.5.0>tar': $tar
  # Security: force all transitive tar to current devDep version (CVE-2026-53655)
  tar: $tar
  esbuild: $esbuild
  protobufjs@8.0.1: $protobufjs
  vite: $vite
  # Security fixes — PlayerData/roadmap#7724
  shell-quote: '1.8.4'
  '@actions/http-client>undici': '6.27.0'
  'node-gyp>undici': '6.27.0'
  '@semantic-release/github>undici': '7.28.0'
  tmp: '0.2.6'
  '@opentelemetry/core': '2.8.0'
  'js-yaml@3': '3.15.0'
  'js-yaml@4': '4.2.0'
  markdown-it: '14.2.0'
  '@babel/core': '7.29.6'

ignoredOptionalDependencies:
  - dtrace-provider
  - moment
  - mv
  - safe-json-stringify

strictPeerDependencies: true

# in line with https://github.com/renovatebot/.github/blob/main/default.json,
# all non-Renovate or non-Containerbase packages should only be installed after
# 7 days
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - '@renovatebot/detect-tools'
  - '@renovatebot/good-enough-parser'
  - '@renovatebot/osv-offline'
  - '@renovatebot/osv-offline-db'
  - '@renovatebot/pep440'
  - '@renovatebot/pgp'
  - '@renovatebot/ruby-semver'
  - '@containerbase/eslint-plugin'
  - '@containerbase/istanbul-reports-html'
  - '@containerbase/semantic-release-pnpm'
  # Renovate security update: simple-git@3.36.0
  - simple-git@3.36.0
